name: Keep Supabase Alive
on:
  schedule:
    # Runs every 4 days at 00:00 UTC
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Allows manual testing in GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -f -s -o /dev/null \
            -H "apikey: YOUR_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer YOUR_SUPABASE_ANON_KEY" \
            "https://uxawnkddduhhvjhrvijn.supabase.co/rest/v1/"