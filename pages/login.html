<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Marvel Tang</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Load Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: var(--bg-color); color: var(--text-main);">

  <div style="text-align: center; padding: 40px; border: 1px solid var(--border-color); border-radius: 12px; max-width: 400px; width: 100%;">
    <span class="mono" style="font-size: 0.8rem; letter-spacing: 1px;">RESTRICTED ACCESS</span>
    <h2 style="margin: 16px 0 24px 0;">Admin Authentication</h2>
    <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.9rem;">Sign in with your Google account to unlock edit mode.</p>
    
    <button id="google-login-btn" style="background: var(--text-main); color: var(--bg-color); border: none; padding: 12px 24px; border-radius: 20px; font-weight: 600; cursor: pointer; width: 100%;">
      Sign in with Google
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://uxawnkddduhhvjhrvijn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_V8JViisHhHsXnTbx3bbtMw_nknLtOEZ';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('google-login-btn').addEventListener('click', async () => {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + '/index.html?edit=true'
        }
      });
      if (error) alert("Login error: " + error.message);
    });
  </script>
</body>
</html>
